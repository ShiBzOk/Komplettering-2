<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 800px;">
        <header class="text-center mb-4">
            <h1 class="display-3 fw-light">Weather Service</h1>
            <p class="lead text-secondary">We'll fetch the weather for you! Where do you want to know the weather?</p>
        </header>

        <div class="row g-3 justify-content-center mb-4">
            <div class="col-12 col-sm-auto">
                <button id="btn-location" class="btn btn-primary btn-lg w-100 px-4">My location!</button>
            </div>
            <div class="col-12 col-sm-6 position-relative">
                <input type="text" id="search-city" class="form-control form-control-lg" placeholder="Enter city here..." data-bs-toggle="popover" data-bs-placement="bottom" data-bs-content="We couldn't find the city, try again!">
            </div>
        </div>

        <div id="current-weather-container" class="mb-5"></div>

        <div id="history-section" class="d-none">
            <h2 class="text-center display-5 fw-light mb-2">Latest requests</h2>
            <p class="text-center text-muted mb-4">We remember your last five requests for you</p>
            <hr class="mb-4">
            <div id="history-container" class="d-flex flex-column gap-3"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
